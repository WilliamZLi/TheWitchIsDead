<form class="TWID-actor-sheet" autocomplete="off">
  <div class="sheet-container">

    <header class="sheet-header">
      <img class="profile-img" src="{{actor.img}}" data-edit="img" title="{{actor.name}}" />

      <div class="char-info">
        <input name="name" type="text" value="{{actor.name}}" placeholder="Character name" />

        <select name="system.species" data-dtype="String">
          <option value="" {{#unless system.species}}selected{{/unless}}>Select a species</option>
          <option value="fox" {{#if (eq system.species "fox")}}selected{{/if}}>Fox</option>
          <option value="cat" {{#if (eq system.species "cat")}}selected{{/if}}>Cat</option>
          <option value="toad" {{#if (eq system.species "toad")}}selected{{/if}}>Toad</option>
          <option value="spider" {{#if (eq system.species "spider")}}selected{{/if}}>Spider</option>
          <option value="owl" {{#if (eq system.species "owl")}}selected{{/if}}>Owl</option>
          <option value="hare" {{#if (eq system.species "hare")}}selected{{/if}}>Hare</option>
          <option value="capybara" {{#if (eq system.species "capybara")}}selected{{/if}}>Capybara</option>
          <option value="crow" {{#if (eq system.species "crow")}}selected{{/if}}>Crow</option>
          <option value="dog" {{#if (eq system.species "dog")}}selected{{/if}}>Dog</option>
          <option value="rat" {{#if (eq system.species "rat")}}selected{{/if}}>Rat</option>
        </select>

        <!-- Power and species section -->
        <div class="random-power">
          <!-- Input on top -->
          <input
            type="text"
            name="system.randomPower"
            value="{{system.randomPower}}"
            placeholder="Your power will appear here"
            readonly
          />

          <!-- Dice and text container -->
          <div class="dice-container">
            <!-- Species -->
            <div class="random-species">
              <h4>Random species:</h4>
              <img
                src="systems/TWID/art/1d10.2.png"
                class="roll-species"
                title="Roll random species (d10)"
              />
            </div>

            <!-- Power -->
            <div class="power-option">
              <h4>Random power:</h4>
              <img
                src="systems/TWID/art/1d10.png"
                class="roll-power"
                title="Roll random power (d10)"
              />
            </div>
          </div>
        </div>

      </div>
    </header>

    <div class="stats-row">
      <!-- Attributes on the left -->
      <section class="attributes">
        <h2>Attributes</h2>
        <div class="attr roll-attribute" data-attr="strength">
          <span class="attr-name">Strength:</span>
          <span class="attr-value">{{system.strength}}</span>
        </div>
        <div class="attr roll-attribute" data-attr="speed">
          <span class="attr-name">Speed:</span>
          <span class="attr-value">{{system.speed}}</span>
        </div>
        <div class="attr roll-attribute" data-attr="stealth">
          <span class="attr-name">Stealth:</span>
          <span class="attr-value">{{system.stealth}}</span>
        </div>
        <div class="attr roll-attribute" data-attr="cunning">
          <span class="attr-name">Cunning:</span>
          <span class="attr-value">{{system.cunning}}</span>
        </div>
      </section>

      <!-- Right column: Danger + Magic -->
      <div class="danger-magic">

        <section class="danger">
          <h2>Danger points</h2>
          <div class="dots">
            <input type="checkbox" name="system.danger.0" {{#if system.danger.[0]}}checked{{/if}} />
            <input type="checkbox" name="system.danger.1" {{#if system.danger.[1]}}checked{{/if}} />
            <input type="checkbox" name="system.danger.2" {{#if system.danger.[2]}}checked{{/if}} />
          </div>
        </section>

        <div class="magic-row">
          <span class="magic-text">Magic:</span>
          <img
            src="systems/TWID/art/1d10.png"
            class="roll-magic"
            title="Roll magic die (d10)"
          />
        </div>

      </div>
    </div>

    <section class="notes">
      <h2>Notes</h2>
      <textarea name="system.notes" placeholder="Character notes...">{{system.notes}}</textarea>
    </section>

    <section class="voice-controls">
      <a class="record-voice" title="Record and send voice (4s)">
        <i class="fas fa-microphone"></i>
      </a>
      <a class="play-local-voice" title="Play recording" style="display: none;">
        <i class="fas fa-play"></i>
      </a>
      <a class="delete-voice" title="Delete recording" style="display: none;">
        <i class="fas fa-trash"></i>
      </a>

      <!-- Permanent settings button -->
      <a class="settings-voice" title="Microphone settings">
        <i class="fas fa-cog"></i>
      </a>
    </section>

  </div>
</form>
